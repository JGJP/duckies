# Copy to ~/.config/duckies/aliases.yaml. Maps a short label to a repo path, so a
# header in duckies-control can be just the label instead of the full path. `~`
# expands to your home dir. A header that isn't a listed alias falls back to the
# usual rules (a path anywhere, or a bare name → ~/_dev/<name>).
moonbase: ~/projects/moonbase
infra: ~/work/infra-monorepo

# The object form adds per-repo worktree setup, run right after `git worktree add` when a
# worktree of this repo is first created (and inherited by nested worktrees):
#   worktree/copy — files/dirs copied in from the base repo (relative paths), for things git
#                   doesn't track but setup needs, e.g. a gitignored `.env` or a cache.
#   worktree/cmd  — shell commands run in the new worktree, in order (via your login shell).
webapp:
  dir: ~/projects/webapp
  worktree/copy:
    - .env
    - .env.local
  worktree/cmd:
    - pnpm install
    - direnv allow
